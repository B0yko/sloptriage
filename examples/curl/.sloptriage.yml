# sloptriage configuration for curl (https://github.com/curl/curl).
version: 1
project:
  name: curl
  aliases: [libcurl]
  repository: https://github.com/curl/curl
  binaries: [curl, curl-config]
version_tags: [curl]          # preset: curl-{major}_{minor}_{patch}
languages: [c]
paths:
  ignore: []
symbols:
  external: []
repro:
  enabled: false
  recipe:
    preset: autotools-asan
    packages: [libpsl-dev, libssl-dev, zlib1g-dev, libnghttp2-dev]
    configure: >-
      autoreconf -fi && ./configure --with-openssl --enable-debug --disable-shared
      --disable-ldap --without-libpsl --prefix=/opt/project
  runners: [c, shell, input]
  harness: "curl --silent --show-error --max-time 10 --config {input}"
  limits:
    timeout: 120
    memory: 2g

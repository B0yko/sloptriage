[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sloptriage"
version = "0.1.0"
description = "Check bug and security reports against the code before you read them: verifies every file, function, line and stack frame a report cites at the stated version, and reruns its PoC in a locked-down sanitizer sandbox. No LLM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Andrii Boiko" }]
keywords = ["security", "triage", "bug-bounty", "tree-sitter", "addresssanitizer", "github-actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0.2,<7",
    "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/B0yko/sloptriage"
Issues = "https://github.com/B0yko/sloptriage/issues"
Changelog = "https://github.com/B0yko/sloptriage/blob/main/CHANGELOG.md"

[project.scripts]
sloptriage = "sloptriage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sloptriage"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "sloptriage/_bundled/schemas"
"demo" = "sloptriage/_bundled/demo"
"bench/manifest" = "sloptriage/_bundled/bench/manifest"
"examples" = "sloptriage/_bundled/examples"

[tool.hatch.build.targets.sdist]
include = ["src/", "schemas/", "demo/", "bench/manifest/", "tests/", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]
ignore = ["S101", "S603", "S607", "S404", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/**" = ["S"]
"eval/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["sloptriage"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sloptriage"]

[[tool.mypy.overrides]]
module = ["tree_sitter_c", "tree_sitter_cpp", "tree_sitter_python", "tree_sitter_javascript", "tree_sitter_typescript", "tree_sitter_go", "tree_sitter_rust"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test opens real network connections (skipped in CI)",
    "docker: test needs a Docker or Podman runtime",
]
addopts = "-ra"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts eval
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run python scripts/render_results.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --python "${PYTHON_VERSION}"
        env:
          PYTHON_VERSION: ${{ matrix.python }}
      - run: uv run pytest -q -m "not network"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - name: Install the wheel into a clean environment outside the source tree
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          uv venv clean
          uv pip install --python clean/bin/python dist/*.whl
          clean/bin/sloptriage --version
          clean/bin/sloptriage demo | tee demo.txt
          grep -q "refs_failed on 30 of 40 low-quality reports and 0 of 20 valid ones" demo.txt
          clean/bin/python -c "from sloptriage.demo_run import check_all; from sloptriage.render import validate_verdict; [validate_verdict(v) for _, v in check_all()]; print('verdicts valid')"

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: zizmor
        run: uv tool run zizmor==1.31.1 --offline action.yml .github/workflows/ examples/workflows/
      - name: actionlint
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          # actionlint 1.7.12 predates GitHub's self-repository syntax (uses: $/)
          ./actionlint -color -ignore 'specifying action "\$/" in invalid format' .github/workflows/*.yml examples/workflows/*.yml

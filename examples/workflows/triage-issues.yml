# Check new and edited issues against the code, then label and comment.
#
# The check job reads the issue only from the event payload file, has read-only
# repository access and no secrets, and renders nothing. The report job gets
# issues:write, downloads the verdict, validates it against the schema and
# renders the card from its fields; it does not check out the repository and
# never runs anything from the issue.
name: Triage issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: sloptriage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    # Optional filter: only issues with a label, e.g.
    # if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: B0yko/sloptriage@v0.1.0
        with:
          mode: check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict
          path: verdict.json
          retention-days: 7

  report:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict
      - uses: B0yko/sloptriage@v0.1.0
        with:
          mode: post
          token: ${{ github.token }}

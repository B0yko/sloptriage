name: Rootless Podman controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Check the sandbox with a bounded fixture
        env:
          SLOPTRIAGE_PODMAN_IMAGE: docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f # 3.22
        run: |
          podman --version
          podman pull "$SLOPTRIAGE_PODMAN_IMAGE"
          uv run pytest -v tests/test_rootless_podman.py

# sloptriage triages this repository's own issues with the action from this
# repository's own commit ("$/", no checkout needed in the report job). Same job
# split and permissions as examples/workflows/triage-issues.yml.
name: Triage issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: sloptriage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/
        with:
          mode: check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict
          path: verdict.json
          retention-days: 7

  report:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict
      - uses: $/
        with:
          mode: post
          token: ${{ github.token }}

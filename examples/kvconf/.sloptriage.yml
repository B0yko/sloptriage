# sloptriage configuration for a Python package (the bundled kvconf demo).
version: 1
project:
  name: kvconf
  binaries: [kvconf]
version_tags: [v]
languages: [python]
# Reproduction (opt-in: sloptriage check --repro). Installs the package from the release tag into a
# Python image; its declared dependencies are resolved when the base image is built.
repro:
  build:
    preset: python-pip
